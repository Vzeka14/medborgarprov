<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Statiska defaultvärden för "/" (måste hållas i synk för hand med
      ROUTE_META['/'] i src/lib/seo.js). De här taggarna är ENDA versionen
      krawlare utan JS-motor någonsin ser — Facebooks länk-crawler
      (delningsförhandsvisningar) kör inte JS, så useSeo-uppdateringen i
      src/lib/seo.js händer aldrig för den. Googlebot kör JS och ser den
      uppdaterade versionen på /medborgarskap och /jagarexamen, men får
      samma korrekta värden redan här på "/" innan JS ens kört.
    -->
    <title>Övningsprov – gratis övningsprov inför svenska prov</title>
    <meta name="description" content="Kostnadsfria övningsprov inför svenska prov. Just nu tillgängliga: medborgarskapsprovet och jägarexamen teoriprov." />
    <link rel="canonical" href="https://ovningsprov.se/" />

    <!--
      og:image/og:type/og:site_name/og:locale/twitter:card gäller hela
      sajten och ändras ALDRIG per rutt — se src/lib/seo.js (useSeo rör
      bara og:title/description/url). og:image måste vara en ABSOLUT URL
      (Facebook löser inte relativa sökvägar).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Övningsprov" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:title" content="Övningsprov – gratis övningsprov inför svenska prov" />
    <meta property="og:description" content="Kostnadsfria övningsprov inför svenska prov. Just nu tillgängliga: medborgarskapsprovet och jägarexamen teoriprov." />
    <meta property="og:url" content="https://ovningsprov.se/" />
    <meta property="og:image" content="https://ovningsprov.se/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      no_onload: SPA:n har egen klientroutning (src/router.jsx) och räknar
      sidvisningar manuellt vid varje rutt-byte, inklusive den första (se
      src/lib/analytics.js) — annars skulle den automatiska räkningen här
      OCH det manuella anropet båda räkna den första sidvisningen.
    -->
    <script
      data-goatcounter="https://medborgarprov.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
